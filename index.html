<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>SoyPerritoOS</title>
<style>
*{box-sizing:border-box}html,body{margin:0;min-height:100%;font-family:system-ui,-apple-system,Segoe UI,sans-serif;background:#09101f;color:#fff}button,input,textarea{font:inherit}body{overflow:hidden}
.os{min-height:100vh;min-height:100svh;background:linear-gradient(135deg,#0d1730,#1a2b52 55%,#0b1122);position:relative}.wall{position:absolute;inset:0;background:radial-gradient(circle at 25% 20%,rgba(77,166,255,.25),transparent 30%),radial-gradient(circle at 80% 70%,rgba(160,100,255,.2),transparent 32%)}
.desktop{position:relative;z-index:1;height:calc(100vh - 64px);height:calc(100svh - 64px);padding:20px;display:flex;gap:18px;align-items:flex-start;flex-wrap:wrap;align-content:flex-start}
.icon{width:92px;background:transparent;border:0;color:white;text-align:center;padding:7px;border-radius:12px;cursor:pointer}.icon:hover{background:rgba(255,255,255,.1)}.emoji{font-size:38px;display:block;margin-bottom:5px}.label{font-size:13px;text-shadow:0 2px 5px #000}
.taskbar{position:absolute;z-index:20;left:0;right:0;bottom:0;height:64px;background:rgba(7,11,23,.9);backdrop-filter:blur(18px);border-top:1px solid rgba(255,255,255,.1);display:flex;align-items:center;padding:8px 12px;gap:8px}.start,.task{height:48px;border:0;border-radius:12px;cursor:pointer}.start{width:48px;background:#fff;color:#17213c;font-size:24px}.task{min-width:48px;background:rgba(255,255,255,.08);color:#fff}.clock{margin-left:auto;text-align:right;font-size:13px;line-height:1.2;color:#d7deee}
.window{position:absolute;z-index:10;left:7%;top:7%;width:min(760px,86%);height:min(560px,74%);background:rgba(17,25,46,.98);border:1px solid rgba(255,255,255,.16);border-radius:16px;box-shadow:0 20px 70px rgba(0,0,0,.5);overflow:hidden;display:flex;flex-direction:column}.bar{height:48px;display:flex;align-items:center;padding:0 12px;background:rgba(255,255,255,.06);border-bottom:1px solid rgba(255,255,255,.08)}.title{font-weight:750}.close{margin-left:auto;border:0;background:#ef6262;color:#fff;width:32px;height:32px;border-radius:9px;cursor:pointer}.content{padding:18px;overflow:auto;flex:1}.hidden{display:none!important}
.menu{position:absolute;z-index:30;bottom:70px;left:12px;width:min(350px,calc(100% - 24px));background:rgba(14,22,41,.99);border:1px solid rgba(255,255,255,.15);border-radius:18px;padding:12px;box-shadow:0 20px 60px #0008}.menu h2{margin:6px 8px 14px}.menu button{display:block;width:100%;text-align:left;background:transparent;color:#fff;border:0;padding:12px;border-radius:10px;cursor:pointer}.menu button:hover{background:rgba(255,255,255,.08)}
.card{background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.1);border-radius:14px;padding:16px;margin-top:12px}.apps{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:12px}.appcard{padding:15px;border:1px solid rgba(255,255,255,.1);background:rgba(255,255,255,.05);border-radius:14px}.appcard h3{margin:0 0 6px}.appcard p{font-size:13px;color:#c9d2e6;min-height:40px}.appcard button,.primary{border:0;border-radius:10px;padding:10px 13px;cursor:pointer;background:#fff;color:#17213c;font-weight:650}.appcard button.alt{background:#263756;color:#fff;margin-left:5px}.webframe{width:100%;height:100%;min-height:300px;border:0;border-radius:10px;background:#fff}.notes{width:100%;height:100%;min-height:260px;background:#0e1528;color:#fff;border:1px solid #34405e;border-radius:10px;padding:12px;resize:none}.calc{max-width:300px;margin:auto}.calc input{width:100%;height:55px;background:#0c1222;color:#fff;border:1px solid #33405f;border-radius:10px;padding:10px;text-align:right;font-size:24px;margin-bottom:10px}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}.grid button{height:52px;border:0;border-radius:10px;background:#263452;color:#fff;cursor:pointer}.welcome{font-size:17px;line-height:1.5}
@media(max-width:600px){.desktop{padding:12px;gap:9px}.icon{width:78px}.window{left:3%;top:4%;width:94%;height:78%}.apps{grid-template-columns:1fr}}
</style>
</head>
<body><div class="os"><div class="wall"></div>
<main class="desktop" id="desktop">
<button class="icon" data-app="about"><span class="emoji">🐶</span><span class="label">SoyPerritoOS</span></button>
<button class="icon" data-app="store"><span class="emoji">🛍️</span><span class="label">Tienda</span></button>
<button class="icon" data-app="files"><span class="emoji">📁</span><span class="label">Archivos</span></button>
<button class="icon" data-app="notes"><span class="emoji">📝</span><span class="label">Notas</span></button>
<button class="icon" data-app="calc"><span class="emoji">🧮</span><span class="label">Calculadora</span></button>
</main><div id="windows"></div>
<div id="menu" class="menu hidden"><h2>🐶 SoyPerritoOS</h2>
<button data-app="store">🛍️ Tienda de aplicaciones</button><button data-app="about">ℹ️ Acerca de SoyPerritoOS</button><button data-app="files">📁 Archivos</button><button data-app="notes">📝 Bloc de notas</button><button data-app="calc">🧮 Calculadora</button></div>
<footer class="taskbar"><button class="start" id="start">🐶</button><button class="task" data-app="store">🛍️</button><button class="task" data-app="files">📁</button><button class="task" data-app="notes">📝</button><span class="clock" id="clock"></span></footer>
</div>
<script>
(()=>{const root=document.querySelector('.os'),wins=document.getElementById('windows'),menu=document.getElementById('menu');let z=10;
const webApps={
 roblox:{name:'Roblox',icon:'🎮',url:'https://www.roblox.com/',desc:'Abrir Roblox en una ventana de SoyPerritoOS.'},
 chatgpt:{name:'ChatGPT',icon:'🤖',url:'https://chatgpt.com/',desc:'Abrir ChatGPT como aplicación web.'},
 minecraft:{name:'Minecraft',icon:'⛏️',url:'https://www.minecraft.net/',desc:'Abrir Minecraft.net. El Launcher nativo no puede instalarse dentro de una web.'}
};
const apps={
about:['🐶 SoyPerritoOS',`<div class="welcome"><b>Bienvenido a SoyPerritoOS.</b><p>Tu PC virtual web. Las aplicaciones web pueden abrirse en ventanas pequeñas y guardarse como accesos instalados dentro de SoyPerritoOS.</p><div class="card">🚀 Versión 1.1<br>👤 SoyPerritoProProYT<br>🌐 Multiplataforma</div></div>`],
files:['📁 Archivos',`<div class="card">📂 Documentos<br>📂 Imágenes<br>📂 Juegos<br>📂 Descargas<br>📦 Aplicaciones instaladas: <span id="installedCount">0</span></div><p>Los accesos instalados se guardan en el navegador de este dispositivo.</p>`],
notes:['📝 Bloc de notas',`<textarea class="notes" placeholder="Escribe aquí..."></textarea>`],
calc:['🧮 Calculadora',`<div class="calc"><input id="display" readonly value="0"><div class="grid">${['7','8','9','÷','4','5','6','×','1','2','3','−','0','.','C','+'].map(x=>'<button type="button">'+x+'</button>').join('')}</div></div>`],
store:['🛍️ Tienda de SoyPerritoOS',`<p>Instala accesos web dentro de tu SoyPerritoOS:</p><div class="apps">${Object.entries(webApps).map(([id,a])=>`<article class="appcard"><h3>${a.icon} ${a.name}</h3><p>${a.desc}</p><button data-install="${id}">Instalar</button><button class="alt" data-open="${id}">Abrir</button></article>`).join('')}</div><div class="card">ℹ️ Importante: una web no puede instalar programas nativos como Roblox Studio o Minecraft Launcher dentro de sí misma. Sí puede crear accesos web, abrirlos en ventanas y, cuando el navegador lo permita, instalar una PWA.</div>`]
};
function installed(){try{return JSON.parse(localStorage.getItem('soyperrito_apps')||'[]')}catch{return[]}}
function saveInstalled(id){const a=installed();if(!a.includes(id))a.push(id);localStorage.setItem('soyperrito_apps',JSON.stringify(a));renderDesktop()}
function openWeb(id){const a=webApps[id];if(!a)return;const w=document.createElement('section');w.className='window';w.style.zIndex=++z;w.innerHTML='<div class="bar"><span class="title">'+a.icon+' '+a.name+'</span><button class="close">×</button></div><div class="content" style="padding:8px"><iframe class="webframe" src="'+a.url+'" title="'+a.name+'"></iframe><p style="font-size:12px;color:#aeb9cf">Si el sitio bloquea iframes, usa el botón Abrir externamente.</p><button class="primary" data-external>Abrir externamente</button></div>';wins.appendChild(w);w.querySelector('.close').onclick=()=>w.remove();w.querySelector('[data-external]').onclick=()=>window.open(a.url,'_blank');w.addEventListener('pointerdown',()=>w.style.zIndex=++z)}
function renderDesktop(){document.querySelectorAll('.installed-icon').forEach(x=>x.remove());installed().forEach(id=>{const a=webApps[id];const b=document.createElement('button');b.className='icon installed-icon';b.innerHTML='<span class="emoji">'+a.icon+'</span><span class="label">'+a.name+'</span>';b.onclick=()=>openWeb(id);document.getElementById('desktop').appendChild(b)})}
function openApp(name){const a=apps[name]||apps.about;const w=document.createElement('section');w.className='window';w.style.zIndex=++z;w.innerHTML='<div class="bar"><span class="title">'+a[0]+'</span><button class="close">×</button></div><div class="content">'+a[1]+'</div>';wins.appendChild(w);w.querySelector('.close').onclick=()=>w.remove();w.addEventListener('pointerdown',()=>w.style.zIndex=++z);
if(name==='store'){w.querySelectorAll('[data-install]').forEach(b=>b.onclick=()=>{saveInstalled(b.dataset.install);b.textContent='Instalado ✓'});w.querySelectorAll('[data-open]').forEach(b=>b.onclick=()=>openWeb(b.dataset.open))}
if(name==='calc'){const d=w.querySelector('#display');let val='';w.querySelectorAll('.grid button').forEach(b=>b.onclick=()=>{const x=b.textContent;if(x==='C'){val='';d.value='0';return}val+=x.replace('×','*').replace('÷','/').replace('−','-');d.value=val||'0'})}}
root.querySelectorAll('[data-app]').forEach(b=>b.addEventListener('click',()=>openApp(b.dataset.app)));document.getElementById('start').onclick=()=>menu.classList.toggle('hidden');menu.querySelectorAll('[data-app]').forEach(b=>b.onclick=()=>{menu.classList.add('hidden');openApp(b.dataset.app)});
function clock(){const d=new Date();document.getElementById('clock').innerHTML=d.toLocaleTimeString('es-ES',{hour:'2-digit',minute:'2-digit'})+'<br>'+d.toLocaleDateString('es-ES',{day:'2-digit',month:'2-digit'})}clock();setInterval(clock,1000);renderDesktop()})()
</script></body></html>
