<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SoyPerritoOS</title><style>*{box-sizing:border-box}html,body{margin:0;height:100%;font-family:system-ui,Segoe UI,sans-serif;background:#09101f;color:#fff}button,input,textarea{font:inherit}body{overflow:hidden}.os{height:100%;background:linear-gradient(135deg,#0b1530,#203968 55%,#10172b);position:relative}.wall{position:absolute;inset:0;background:radial-gradient(circle at 20% 20%,#4da6ff40,transparent 30%),radial-gradient(circle at 80% 70%,#a064ff33,transparent 35%)}.desktop{position:absolute;inset:0 0 64px;padding:18px;display:flex;gap:14px;align-content:flex-start;flex-wrap:wrap;overflow:auto}.icon{width:92px;border:0;background:transparent;color:#fff;border-radius:12px;padding:7px;cursor:pointer;text-align:center}.icon:hover{background:#ffffff18}.emoji{display:block;font-size:38px}.label{font-size:13px;text-shadow:0 2px 5px #000}.taskbar{position:absolute;z-index:100;bottom:0;left:0;right:0;height:64px;background:#080d18ef;backdrop-filter:blur(18px);display:flex;gap:8px;padding:8px 12px;border-top:1px solid #ffffff18}.start,.task{border:0;border-radius:12px;cursor:pointer;color:#fff;background:#ffffff12;height:48px}.start{width:48px;background:#fff;color:#17213c;font-size:24px}.task{min-width:48px}.clock{margin-left:auto;text-align:right;font-size:12px;line-height:1.2;padding-top:7px}.menu{position:absolute;z-index:200;left:12px;bottom:72px;width:min(360px,calc(100% - 24px));background:#0e1629fa;border:1px solid #ffffff22;border-radius:18px;padding:12px;box-shadow:0 20px 70px #0009}.menu button{display:block;width:100%;padding:12px;text-align:left;background:transparent;color:#fff;border:0;border-radius:10px;cursor:pointer}.menu button:hover{background:#ffffff12}.window{position:absolute;z-index:20;left:8%;top:7%;width:min(780px,84%);height:min(570px,76%);min-width:280px;min-height:190px;background:#11192ef7;border:1px solid #ffffff25;border-radius:15px;box-shadow:0 22px 70px #0009;overflow:hidden;display:flex;flex-direction:column;resize:both}.bar{height:46px;min-height:46px;display:flex;align-items:center;padding:0 10px;background:#ffffff0d;border-bottom:1px solid #ffffff14;cursor:grab;user-select:none}.title{font-weight:750}.winbtns{margin-left:auto;display:flex;gap:6px}.winbtn{border:0;width:30px;height:30px;border-radius:8px;background:#ffffff12;color:#fff;cursor:pointer}.close{background:#e65c65}.content{padding:16px;overflow:auto;flex:1}.hidden{display:none!important}.card,.appcard{background:#ffffff0a;border:1px solid #ffffff14;border-radius:14px;padding:15px;margin-top:12px}.apps{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:12px}.appcard h3{margin:0 0 7px}.appcard p{font-size:13px;color:#cbd5e7;min-height:38px}.appcard button,.primary{border:0;border-radius:9px;padding:9px 12px;cursor:pointer;background:#fff;color:#17213c;font-weight:700}.appcard .alt{background:#263756;color:#fff;margin-left:5px}.webframe{width:100%;height:calc(100% - 40px);min-height:260px;border:0;border-radius:9px;background:#fff}.notes{width:100%;height:100%;min-height:260px;background:#0c1325;color:#fff;border:1px solid #33405f;border-radius:10px;padding:12px;resize:none}.calc{max-width:300px;margin:auto}.calc input{width:100%;height:55px;background:#0c1222;color:#fff;border:1px solid #33405f;border-radius:10px;padding:10px;text-align:right;font-size:24px;margin-bottom:10px}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}.grid button{height:52px;border:0;border-radius:10px;background:#263452;color:#fff;cursor:pointer}.download{background:#2f7cf6!important;color:#fff!important}.downloaded{background:#2e9d63!important;color:#fff!important}@media(max-width:600px){.desktop{padding:10px;gap:6px}.icon{width:76px}.window{left:2%;top:3%;width:96%;height:80%}}</style></head><body><div class="os"><div class="wall"></div><main class="desktop" id="desktop"><button class="icon" data-app="about"><span class="emoji">🐶</span><span class="label">SoyPerritoOS</span></button><button class="icon" data-app="store"><span class="emoji">🛍️</span><span class="label">Tienda</span></button><button class="icon" data-app="files"><span class="emoji">📁</span><span class="label">Archivos</span></button><button class="icon" data-app="notes"><span class="emoji">📝</span><span class="label">Notas</span></button><button class="icon" data-app="calc"><span class="emoji">🧮</span><span class="label">Calculadora</span></button></main><div id="windows"></div><div id="menu" class="menu hidden"><h2>🐶 SoyPerritoOS</h2><button data-app="store">🛍️ Tienda</button><button data-app="browser">🌐 Navegador</button><button data-app="files">📁 Archivos</button><button data-app="notes">📝 Bloc de notas</button><button data-app="calc">🧮 Calculadora</button><button data-app="settings">⚙️ Configuración</button></div><footer class="taskbar"><button class="start" id="start">🐶</button><button class="task" data-app="store">🛍️</button><button class="task" data-app="browser">🌐</button><button class="task" data-app="files">📁</button><button class="task" data-app="settings">⚙️</button><span class="clock" id="clock"></span></footer></div><script>
(()=>{const wins=document.getElementById('windows'),menu=document.getElementById('menu'),desktop=document.getElementById('desktop');let z=20;
const webApps={chrome:{name:'Google Chrome',icon:'🌐',url:'https://www.google.com/chrome/',desc:'Descarga digital de Chrome. El archivo se guarda en Descargas cuando el navegador lo permite.'},roblox:{name:'Roblox',icon:'🎮',url:'https://www.roblox.com/',desc:'Abrir Roblox como web.'},chatgpt:{name:'ChatGPT',icon:'🤖',url:'https://chatgpt.com/',desc:'Abrir ChatGPT como web.'},minecraft:{name:'Minecraft',icon:'⛏️',url:'https://www.minecraft.net/',desc:'Abrir Minecraft.net.'}};
function installed(){try{return JSON.parse(localStorage.getItem('soyperrito_apps')||'[]')}catch(e){return[]}}function save(id){let a=installed();if(!a.includes(id))a.push(id);localStorage.setItem('soyperrito_apps',JSON.stringify(a));render()}
function render(){document.querySelectorAll('.installed-icon').forEach(x=>x.remove());installed().forEach(id=>{let a=webApps[id],b=document.createElement('button');b.className='icon installed-icon';b.innerHTML='<span class="emoji">'+a.icon+'</span><span class="label">'+a.name+'</span>';b.onclick=()=>openWeb(id);desktop.appendChild(b)})}
function downloadChrome(){let a=webApps.chrome;let blob=new Blob(['SoyPerritoOS - paquete digital de Google Chrome\\n\\nAcceso oficial de descarga: '+a.url+'\\n\\nEste archivo representa la descarga digital dentro de SoyPerritoOS. El navegador del dispositivo debe descargar el instalador real desde la página oficial de Google.'],{type:'text/plain'});let u=URL.createObjectURL(blob),x=document.createElement('a');x.href=u;x.download='Google-Chrome-SoyPerritoOS.txt';document.body.appendChild(x);x.click();x.remove();URL.revokeObjectURL(u);save('chrome');alert('Chrome se ha añadido a SoyPerritoOS y se ha iniciado la descarga digital.')}
function openWeb(id){let a=webApps[id],w=document.createElement('section');w.className='window';w.style.zIndex=++z;w.innerHTML='<div class="bar"><span class="title">'+a.icon+' '+a.name+'</span><div class="winbtns"><button class="winbtn min">−</button><button class="winbtn max">□</button><button class="winbtn close">×</button></div></div><div class="content" style="padding:8px"><iframe class="webframe" src="'+a.url+'" title="'+a.name+'"></iframe><p style="font-size:12px;color:#aeb9cf">'+a.desc+'</p><button class="primary external">Abrir externamente</button></div>';wins.appendChild(w);wire(w);w.querySelector('.external').onclick=()=>window.open(a.url,'_blank')}
function openApp(name){if(name==='browser'){openWeb('chrome');return}let data={about:['🐶 SoyPerritoOS','<h2>Bienvenido a SoyPerritoOS</h2><p>Tu PC virtual web.</p><div class="card">🪟 Ventanas movibles, minimizables y maximizables<br>🛍️ Tienda<br>📁 Archivos<br>🌐 Navegador<br>⚙️ Configuración</div>'],files:['📁 Archivos','<div class="card">📂 Documentos<br>📂 Imágenes<br>📂 Juegos<br>📂 Descargas<br>📦 Aplicaciones instaladas: '+installed().length+'</div>'],notes:['📝 Bloc de notas','<textarea class="notes" placeholder="Escribe aquí..."></textarea>'],settings:['⚙️ Configuración','<div class="card"><h3>Aplicaciones</h3><p>Las instalaciones digitales de SoyPerritoOS se guardan en este navegador.</p><button class="primary" onclick="localStorage.removeItem(\'soyperrito_apps\');location.reload()">Restablecer aplicaciones</button></div>'],calc:['🧮 Calculadora','<div class="calc"><input id="display" readonly value="0"><div class="grid">'+['7','8','9','÷','4','5','6','×','1','2','3','−','0','.','C','+'].map(x=>'<button>'+x+'</button>').join('')+'</div></div>'],store:['🛍️ Tienda de SoyPerritoOS','<p>Descarga e instala aplicaciones digitales:</p><div class="apps">'+Object.entries(webApps).map(([id,a])=>'<article class="appcard"><h3>'+a.icon+' '+a.name+'</h3><p>'+a.desc+'</p>'+(id==='chrome'?'<button class="download" data-chrome>⬇️ Descargar Chrome</button>':'<button data-install="'+id+'">Instalar</button>')+'<button class="alt" data-open="'+id+'">Abrir</button></article>').join('')+'</div><div class="card">📥 Chrome se descarga digitalmente desde la Tienda. Por seguridad, el instalador real de Chrome siempre debe proceder de Google; SoyPerritoOS no falsifica ni modifica el instalador.</div>']};let a=data[name]||data.about,w=document.createElement('section');w.className='window';w.style.zIndex=++z;w.innerHTML='<div class="bar"><span class="title">'+a[0]+'</span><div class="winbtns"><button class="winbtn min">−</button><button class="winbtn max">□</button><button class="winbtn close">×</button></div></div><div class="content">'+a[1]+'</div>';wins.appendChild(w);wire(w);if(name==='store'){let c=w.querySelector('[data-chrome]');if(c)c.onclick=downloadChrome;w.querySelectorAll('[data-install]').forEach(b=>b.onclick=()=>{save(b.dataset.install);b.textContent='Instalado ✓'});w.querySelectorAll('[data-open]').forEach(b=>b.onclick=()=>openWeb(b.dataset.open))}if(name==='calc'){let d=w.querySelector('#display'),v='';w.querySelectorAll('.grid button').forEach(b=>b.onclick=()=>{let x=b.textContent;if(x==='C'){v='';d.value='0';return}v+=x.replace('×','*').replace('÷','/').replace('−','-');d.value=v})}}
function wire(w){let bar=w.querySelector('.bar');w.querySelector('.close').onclick=()=>w.remove();w.querySelector('.min').onclick=()=>{w.dataset.min=w.dataset.min?'':'1';w.querySelector('.content').style.display=w.dataset.min?'none':'block';w.style.height=w.dataset.min?'46px':''};w.querySelector('.max').onclick=()=>{if(w.dataset.max){w.style.left=w.dataset.l||'8%';w.style.top=w.dataset.t||'7%';w.style.width=w.dataset.w||'780px';w.style.height=w.dataset.h||'570px';delete w.dataset.max}else{w.dataset.l=w.style.left;w.dataset.t=w.style.top;w.dataset.w=w.style.width;w.dataset.h=w.style.height;w.dataset.max='1';Object.assign(w.style,{left:'0',top:'0',width:'100%',height:'calc(100% - 64px)',borderRadius:'0'})}};w.addEventListener('pointerdown',()=>w.style.zIndex=++z);let drag=false,sx=0,sy=0,ox=0,oy=0;bar.addEventListener('pointerdown',e=>{if(e.target.tagName==='BUTTON')return;drag=true;sx=e.clientX;sy=e.clientY;ox=w.offsetLeft;oy=w.offsetTop;bar.setPointerCapture(e.pointerId)});bar.addEventListener('pointermove',e=>{if(!drag||w.dataset.max)return;w.style.left=Math.max(0,ox+e.clientX-sx)+'px';w.style.top=Math.max(0,oy+e.clientY-sy)+'px'});bar.addEventListener('pointerup',()=>drag=false)}
document.querySelectorAll('[data-app]').forEach(b=>b.onclick=()=>openApp(b.dataset.app));document.getElementById('start').onclick=()=>menu.classList.toggle('hidden');menu.querySelectorAll('[data-app]').forEach(b=>b.onclick=()=>{menu.classList.add('hidden');openApp(b.dataset.app)});function clock(){let d=new Date();document.getElementById('clock').innerHTML=d.toLocaleTimeString('es-ES',{hour:'2-digit',minute:'2-digit'})+'<br>'+d.toLocaleDateString('es-ES',{day:'2-digit',month:'2-digit'})}clock();setInterval(clock,1000);render()})()
</script></body></html>
